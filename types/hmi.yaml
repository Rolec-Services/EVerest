description: Types for the HMI interface.
types:
  CameraConfig:
    description: Camera configuration.
    type: object
    additionalProperties: false
    properties:
      fps:
        description: Frames per second.
        type: integer
      width:
        description: Frame width in pixels.
        type: integer
      height:
        description: Frame height in pixels.
        type: integer
  CameraFrame:
    description: One JPEG frame from a configured camera.
    type: object
    additionalProperties: false
    required:
      - camera_id
      - frame
    properties:
      camera_id:
        description: Protocol id of the camera that produced the frame.
        type: integer
      frame:
        description: Base64-encoded JPEG frame.
        type: string
